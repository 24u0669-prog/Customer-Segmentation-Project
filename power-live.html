<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Power BI Live Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f7f7f7;
    color: #222;
}

/* HEADER */

.header {
    height: 70px;
    background: white;
    border-bottom: 1px solid #ddd;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 30px;
}

.header h1 {
    font-size: 20px;
    font-weight: 600;
}

.back-btn {
    background: #f2c811;
    border: none;
    padding: 11px 20px;
    border-radius: 6px;

    font-weight: 600;
    cursor: pointer;

    transition: 0.3s;
}

.back-btn:hover {
    transform: translateY(-2px);
    background: #d9b000;
}

/* DASHBOARD */

.dashboard-container {
    padding: 35px;
}

.dashboard {

    max-width: 1150px;

    margin: auto;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 32px;
}

/* CARD */

.card {

    height: 255px;

    background: white;

    border: 1px solid #e5e5e5;

    border-radius: 7px;

    padding: 14px;

    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
}

.card-title {
    font-size: 14px;
    margin-bottom: 3px;
}

.card-subtitle {
    font-size: 12px;
    color: #555;
}

/* HORIZONTAL CHART */

.horizontal-chart {

    height: 195px;

    display: flex;

    align-items: center;

    position: relative;

    margin-top: 8px;
}

.y-axis {

    width: 30px;

    height: 145px;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    font-size: 10px;

    color: #555;
}

.horizontal-bars {

    flex: 1;

    height: 145px;

    display: flex;

    flex-direction: column;

    justify-content: space-between;
}

.horizontal-row {

    height: 4px;

    display: flex;

    align-items: center;
}

.horizontal-bar {

    height: 3px;

    background: #d33b3b;
}

.x-axis {

    position: absolute;

    left: 30px;
    right: 0;

    bottom: 2px;

    display: flex;

    justify-content: space-between;

    font-size: 9px;

    color: #666;
}

/* KPI */

.metric {

    height: 200px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    padding-left: 0;
}

.metric-label {

    font-size: 12px;

    color: #444;
}

.metric-value {

    font-size: 20px;

    margin-top: 3px;
}

/* VERTICAL CHART */

.vertical-chart {

    height: 195px;

    display: flex;

    align-items: flex-end;

    position: relative;

    padding: 10px 15px 20px 45px;
}

.vertical-axis {

    position: absolute;

    left: 10px;

    top: 8px;

    height: 150px;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    font-size: 9px;

    color: #555;
}

.vertical-bars {

    height: 150px;

    flex: 1;

    display: flex;

    align-items: flex-end;

    gap: 6px;
}

.vertical-bar {

    width: 6px;

    background: #d33b3b;
}

.vertical-labels {

    position: absolute;

    left: 45px;

    right: 10px;

    bottom: 2px;

    display: flex;

    justify-content: space-between;

    font-size: 9px;

    color: #666;
}


/* MOBILE */

@media(max-width:750px) {

    .dashboard {

        grid-template-columns: 1fr;

    }

    .dashboard-container {

        padding: 15px;

    }

    .header {

        padding: 0 15px;

    }

}

</style>

</head>


<body>

<header class="header">

    <h1>
        📊 Power BI Live Dashboard
    </h1>

    <!-- IMPORTANT: GOES BACK TO INDEX.HTML -->

    <button

            </div>

            </div>

</div>

            <div class="vertical-bar" style="height:60%;"></div>
            <div class="vertical-bar" style="height:90%;"></div>
            <div class="vertical-bar" style="height:35%;"></div>
            <div class="vertical-bar" style="height:60%;"></div>

        </div>


        <div class="vertical-labels">

</div>

</main>


</body>
</html>
